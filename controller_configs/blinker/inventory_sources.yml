---
controller_inventory_sources:
################
## PROXMOX VE ##
################
  - name: Proxmox VE
    organization: Blinker19
    source: scm
    source_path: inventories/proxmox/proxmox.yml
    inventory: Proxmox Inventory
    execution_environment: Community General EE
    source_project: Blinker Project
    credential: Proxmox
    description: created by Ansible controller
    overwrite: true
    update_on_launch: true
    update_cache_timeout: 0

################
##  Insights  ##
################
  - name: Red Hat Insights
    organization: Blinker19
    source: insights 
    limit: ""
    source_path: ""
    source_vars:
      get_tags: true
      get_system_advisories: true
      groups:
        patch_bugs: insights_patching.rhba_count > 0
        patch_enhancements: insights_patching.rhea_count > 0
        patch_security: insights_patching.rhsa_count > 0
      selection: none
      compose:
        ansible_host: insights_ansible_host
    inventory: "Insights Inventory"
    update_on_launch: "False"
    overwrite: "True"
    credential: "Insights - Blinker19"


