---
controller_inventory_sources:
################
## PROXMOX VE ##
################
  - name: Proxmox VE
    source: scm
    source_path: inventories/proxmox/proxmox.yml
    inventory: Proxmox Inventory
    execution_environment: Community General EE
    source_project: Blinker Project
    credential: Proxmox
    description: created by Ansible controller
    overwrite: true
    update_on_launch: true
    update_cache_timeout: 0

################
##  Insights  ##
################
  - name: Red Hat Insights
    source: insights 
    inventory: Local Inventory
    execution_environment:
    credential: Insights - Blinker19
    overwrite: true
    update_on_launch: true
    update_cache_timeout: 0
    source_vars:
      get_tags: true
      get_system_advisories: true
      groups:
        os: insights_patching.os
      ## This compose works because I ran this on the systems
      ## sudo insights-client --ansible-host `ip address show dynamic |grep 'inet ' | cut -d/ -f1 | awk '{print $2}'`
      compose:
        ansible_host: insights_ansible_host

