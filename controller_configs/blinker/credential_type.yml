---
controller_credential_types:
- name: Proxmox Virtual Environment 
  description: Proxmox VE Credential Type
  inputs:
    fields:
      - id: ip
        type: string
        label: Proxmox Virtual Environment IP Address
        help_text: Something like 192.168.1.232
      - id: user
        type: string
        label: User
      - id: password
        type: string
        label: Password
        secret: true
      - id: token
        type: string
        label: Token
        secret: true
        help_text: >-
          An OAuth token to use to authenticate with.This should not be set if
          username/password are being used.
      - id: verify_ssl
        type: boolean
        label: Verify SSL
    required:
      - ip
      - user
  injectors:
    env:
      PROXMOX_URL: !unsafe "https://{{ ip }}:8006"
      PROXMOX_IP: !unsafe "{{ ip }}"
      PROXMOX_USER: !unsafe "{{ user }}"
      PROXMOX_PASSWORD: !unsafe "{{ password }}"
      PROXMOX_VERIFY_SSL: !unsafe "{{ verify_ssl }}"
      PROXMOX_OAUTH_TOKEN: !unsafe "{{ token }}"