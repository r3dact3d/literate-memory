---
controller_credentials:
  - name: Proxmox - Fake
    credential_type: Proxmox Virtual Environment
    organization: Blinker19
    description: Credential for Proxmox
    inputs:
      ip: PROXMOX_IP
      url: PROXMOX_URL
      user: PROXMOX_USER
      password: PROXMOX_PASSWORD
      token: PROXMOX_TOKEN
      verify_ssl: false

  - name: Insights - Fake
    credential_type: Insights
    organization: Blinker19
    description: Credential for Insights Compliance
    inputs:
      username: Red Hat Console username
      password: Console RH password 
      client_id: 'null'
      client_secret: 'null'

  
