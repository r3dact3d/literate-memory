---
controller_templates:
  - name: Get Stats JT
    credentials:
      - AAP Admin
    job_type: run
    inventory: Local Inventory
    project: Get Controller Stats
    playbook: random-plays/getControllerStats.yml
    ask_variables_on_launch: yes
    extra_vars:
      controller_hostname:
      controller_password:

  
  - name: Terraform Init and Plan
    job_type: run
    inventory: Local Inventory
    project: Urban Terraform
    playbook: playbooks/tf_init_plan.yml
    execution_environment: Community Terraform EE
    use_fact_cache: yes
    extra_vars: ''
  - name: Terraform Load and Apply
    job_type: run
    inventory: Local Inventory
    project: Urban Terraform
    playbook: playbooks/tf_apply_plan.yml
    execution_environment: Community Terraform EE
    extra_vars: ''
    use_fact_cache: yes
  
############################
## Ansible Builder Stream ##
############################
  - name: EE Streamer
    credentials:
      - AAP Admin
    job_type: run
    inventory: Demo Inventory
    project: Ansible EE Builder Stream
    playbook: ee_builder.yml
    execution_environment: AAP Builder Stream EE
    instance_groups: ansible_builder
    ask_variables_on_launch: no
    extra_vars:  
      ah_token:
    labels: builder_job

  - name: EE Streamer Survey
    credentials:
      - AAP Admin
    job_type: run
    inventory: Demo Inventory
    project: Ansible EE Builder Stream
    playbook: ee_builder_survey.yml
    execution_environment: AAP Builder Stream EE
    instance_groups: ansible_builder
    ask_variables_on_launch: no
    survey_enabled: true
    survey: "{{ lookup('template', '../controller_configs/template_surveys/ansible_builder_survey.json') | regex_replace('\\n', '') }}"
    extra_vars: 
      ah_token:
    labels: builder_job

############################
##  Ansible Project Jobs  ##
############################
  - name: Get Inventory Groups
    job_type: run
    project: Blinker Project
    playbook: playbooks/inventory_groups.yml
    ask_credentials_on_launch: yes
    ask_inventory_on_launch: yes
    ask_variables_on_launch: yes

  