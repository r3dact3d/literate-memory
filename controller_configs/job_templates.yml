---
controller_templates:
  - name: Get Stats JT
    credentials:
      - AAP Admin
    job_type: run
    inventory: Local Inventory
    project: Get Controller Stats
    playbook: random-plays/getControllerStats.yml
    ask_variables_on_launch: true
    extra_vars:
      controller_hostname:
      controller_password:

  
  - name: Terraform Init and Plan
    job_type: run
    inventory: Local Inventory
    project: Urban Terraform
    playbook: playbooks/tf_init_plan.yml
    execution_environment: terraform-ee-base
    use_fact_cache: yes
    extra_vars: ''
  - name: Terraform Load and Apply
    job_type: run
    inventory: Local Inventory
    project: Urban Terraform
    playbook: playbooks/tf_apply_plan.yml
    execution_environment: terraform-ee-base
    extra_vars: ''
    use_fact_cache: yes
  
############################
## Ansible Builder Stream ##
############################
  - name: EE Streamer
    job_type: run
    inventory: Local Inventory
    project: Ansible EE Builder Stream
    playbook: ee_builder.yml
    execution_environment: ee-aap-builder-stream
    instance_groups: ansible_builder
    extra_vars:
      ee_registry_dest: docker.io/brthomps
      ee_registry_username: r3dact3d
      ee_registry_password: 
    labels: ansible_job

