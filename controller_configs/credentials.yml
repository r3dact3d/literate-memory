---
controller_credentials:
  - name: Proxmox
    credential_type: Proxmox Virtual Environment
    description: Credential type for Proxmox
    inputs:
      url: PROXMOX_URL
      user: PROXMOX_USER
      password: PROXMOX_PASSWORD
      token: PROXMOX_TOKEN
      verify_ssl: false
