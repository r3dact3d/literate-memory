---
controller_credential_types:
- name: Proxmox Virtual Environment 
  description: Proxmox VE Credential Type
  inputs:
    fields:
      - id: url
        type: string
        label: Proxmox Virtual Environment URL
        help_text: Something like 'https://192.168.1.232:8006'
      - id: user
        type: string
        label: User
      - id: password
        type: string
        label: Password
        secret: true
      - id: token
        type: string
        label: Token
        secret: true
        help_text: >-
          An OAuth token to use to authenticate with.This should not be set if
          username/password are being used.
      - id: verify_ssl
        type: boolean
        label: Verify SSL
    required:
      - password
  injectors:
    env:
    PROXMOX_URL: '{{url}}'
    PROXMOX_USER: '{{user}}'
    PROXMOX_PASSWORD: '{{password}}'
    PROXMOX_VERIFY_SSL: '{{verify_ssl}}'
    PROXMOX_OAUTH_TOKEN: '{{token}}'