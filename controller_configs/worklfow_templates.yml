---
controller_workflows:
  - name: Urban Terraform Workflow
    description: Terraform Collection Workflow
    extra_vars: ''
    survey_enabled: true
    survey: "{{ lookup('template', '../controller_configs/template_surveys/terraform_survey.json') | regex_replace('\\n', '') }}"
    allow_simultaneous: false
    ask_variables_on_launch: true
    inventory:
    limit:
    scm_branch:
    ask_inventory_on_launch: false
    ask_scm_branch_on_launch: false
    ask_limit_on_launch: false
    webhook_service: ''
    webhook_credential:
    organization: Launch
    schedules: []
    simplified_workflow_nodes:
      - all_parents_must_converge: false
        identifier: Init and Plan
        unified_job_template: Terraform Init and Plan
        credentials: []
        success_nodes:
          - Plan Review
        failure_nodes: []
        always_nodes: []
      - identifier: Plan Review
        approval_node:
          name: Plan Review Node
          description: Approve this to proceed in workflow
          timeout: 900 # 15 minutes
        success_nodes:
          - Load and Apply
      - all_parents_must_converge: false
        identifier: Load and Apply
        unified_job_template: Terraform Load and Apply
        credentials: []
        success_nodes: []
        failure_nodes: []
        always_nodes: []
    notification_templates_started: []
    notification_templates_success: []
    notification_templates_error: []
    notification_templates_approvals: []

  - name: "Get Proxmox Info WT"
    description: !unsafe ''
    organization: "Blinker19"
    simplified_workflow_nodes:
      - identifier: "Log Proxmox Node Info"
        workflow_job_template: "Get Proxmox Info WT"
        unified_job_template: "Log Proxmox Node Info"
        limit: ""
        organization: "Blinker19"
        all_parents_must_converge: "False"
      - identifier: "Get Proxmox Node Info"
        workflow_job_template: "Get Proxmox Info WT"
        unified_job_template: "Proxmox Node Info"
        limit: ""
        organization: "Blinker19"
        all_parents_must_converge: "False"
        success_nodes:
          - "Log Proxmox Node Info"
          - "Get Proxmox VM Info"
      - identifier: "Log Proxmox VM Info"
        workflow_job_template: "Get Proxmox Info WT"
        unified_job_template: "Log Proxmox VMs Info"
        limit: ""
        organization: "Blinker19"
        all_parents_must_converge: "False"
      - identifier: "Get Proxmox VM Info"
        workflow_job_template: "Get Proxmox Info WT"
        unified_job_template: "Proxmox VM Info"
        limit: ""
        organization: "Blinker19"
        all_parents_must_converge: "False"
        success_nodes:
          - "Log Proxmox VM Info"
    ask_variables_on_launch: "False"
    allow_simultaneous: "False"
    scm_branch: ""
    limit: ""
    ask_limit_on_launch: false
    ask_inventory_on_launch: false
    webhook_service: ""
    extra_vars: ""
    labels:
      - "proxmox"
    survey_enabled: false
    survey_spec:
      name: ""
      spec:
        - max: 128
          min: 0
          type: text
          required: True
          variable: ct_hostname
          new_question: True
          question_name: !unsafe "Enter new container hostname"
        - max: 128
          min: 0
          type: password
          required: True
          variable: host_password
          new_question: True
          question_name: !unsafe "Enter new container password"
      description: ""

  - name: "Create Proxmox Container WT"
    description: !unsafe ''
    organization: "Blinker19"
    simplified_workflow_nodes:
      - identifier: "Get Proxmox Node Info"
        workflow_job_template: "Create Proxmox Container WT"
        unified_job_template: "Proxmox Node Info"
        limit: ""
        organization: "Blinker19"
        all_parents_must_converge: "False"
        success_nodes:
          - "Create Container"
      - identifier: "Get Proxmox Container Info"
        workflow_job_template: "Create Proxmox Container WT"
        unified_job_template: "Get New Container Info"
        limit: ""
        organization: "Blinker19"
        all_parents_must_converge: "False"
      - identifier: "Create Container"
        workflow_job_template: "Create Proxmox Container WT"
        unified_job_template: "Create Proxmox Container"
        limit: ""
        organization: "Blinker19"
        all_parents_must_converge: "False"
        success_nodes:
          - "Sync Proxmox Inventory"
          - "Get Proxmox Container Info"
      - identifier: "Sync Proxmox Inventory"
        workflow_job_template: "Create Proxmox Container WT"
        unified_job_template: "Proxmox VE"
        limit: ""
        organization: "Blinker19"
        all_parents_must_converge: "False"
        success_nodes:
          - "f3b7776b-7b0f-41a0-8621-254f157fad5b"
      - identifier: "f3b7776b-7b0f-41a0-8621-254f157fad5b"
        inventory: "Proxmox Inventory"
        workflow_job_template: "Create Proxmox Container WT"
        unified_job_template: "Get Inventory Groups"
        limit: ""
        organization: "Blinker19"
        all_parents_must_converge: "False"
    ask_variables_on_launch: "False"
    allow_simultaneous: "False"
    scm_branch: ""
    limit: ""
    ask_limit_on_launch: false
    ask_inventory_on_launch: false
    webhook_service: ""
    extra_vars: ""
    labels:
      - "proxmox"
    survey_enabled: true
    survey_spec:
      name: ""
      spec:
        - max: 1024
          min: 0
          type: multiplechoice
          choices:
            - fedora-41-default_20241118_amd64.tar.xz
            - ubuntu-24.04-standard_24.04-2_amd64.tar.zst
          default: !unsafe "fedora-41-default_20241118_amd64.tar.xz"
          required: True
          variable: ct_ostemplate
          new_question: True
          question_name: !unsafe "Select Container OS "
        - max: 128
          min: 0
          type: text
          required: True
          variable: ct_hostname
          new_question: True
          question_name: !unsafe "Enter the Container Hostname"
        - max: 128
          min: 0
          type: password
          required: True
          variable: host_password
          new_question: True
          question_name: !unsafe "Enter the Container Password"
      description: ""
